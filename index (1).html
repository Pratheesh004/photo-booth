```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Photo Booth</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .booth {
            width: 100%;
            max-width: 500px;
            text-align: center;
            padding: 20px;
        }

        h1 {
            margin-bottom: 15px;
        }

        .camera-box {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 4;
            background: #000;
            border-radius: 18px;
            overflow: hidden;
        }

        video,
        canvas,
        #photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 18px;
        }

        canvas {
            display: none;
        }

        #photo {
            display: none;
        }

        #countdown {
            position: absolute;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            font-size: 100px;
            font-weight: bold;
            background: rgba(0,0,0,0.25);
        }

        .buttons {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button,
        a {
            border: none;
            border-radius: 10px;
            padding: 14px 22px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }

        #captureBtn {
            background: #00d084;
            color: white;
        }

        #retakeBtn {
            background: #ff4757;
            color: white;
            display: none;
        }

        #downloadBtn {
            background: #3498db;
            color: white;
            display: none;
        }

        #shareBtn {
            background: #9b59b6;
            color: white;
            display: none;
        }

        #cameraBtn {
            background: #f39c12;
            color: white;
        }

        .message {
            margin-top: 15px;
            color: #bbb;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="booth">

    <h1>📸 My Photo Booth</h1>

    <div class="camera-box">

        <video id="video" autoplay playsinline></video>

        <img id="photo" alt="Captured Photo">

        <canvas id="canvas"></canvas>

        <div id="countdown"></div>

    </div>

    <div class="buttons">

        <button id="captureBtn">
            📸 Take Photo
        </button>

        <button id="retakeBtn">
            🔄 Retake
        </button>

        <a id="downloadBtn" download="photo-booth.jpg">
            ⬇️ Download
        </a>

        <button id="shareBtn">
            📤 Share
        </button>

        <button id="cameraBtn">
            🔄 Switch Camera
        </button>

    </div>

    <div class="message" id="message">
        Allow camera access to start.
    </div>

</div>


<script>

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const photo = document.getElementById("photo");

    const captureBtn = document.getElementById("captureBtn");
    const retakeBtn = document.getElementById("retakeBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const shareBtn = document.getElementById("shareBtn");
    const cameraBtn = document.getElementById("cameraBtn");

    const countdown = document.getElementById("countdown");
    const message = document.getElementById("message");

    let stream = null;

    let facingMode = "user";

    let photoData = null;


    // Start camera
    async function startCamera() {

        try {

            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }

            stream = await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: facingMode,
                    width: {
                        ideal: 1080
                    },
                    height: {
                        ideal: 1440
                    }
                },

                audio: false

            });

            video.srcObject = stream;

            message.textContent = "Camera ready. Smile! 😊";

        }

        catch (error) {

            console.error(error);

            message.textContent =
                "Camera permission was denied or camera is unavailable.";

        }

    }


    // Countdown
    function startCountdown() {

        let number = 3;

        countdown.style.display = "flex";

        countdown.textContent = number;

        const timer = setInterval(() => {

            number--;

            if (number > 0) {

                countdown.textContent = number;

            }

            else {

                clearInterval(timer);

                countdown.style.display = "none";

                takePhoto();

            }

        }, 1000);

    }


    // Capture photo
    function takePhoto() {

        const width = video.videoWidth;
        const height = video.videoHeight;

        canvas.width = width;
        canvas.height = height;

        const context = canvas.getContext("2d");

        context.drawImage(
            video,
            0,
            0,
            width,
            height
        );

        photoData = canvas.toDataURL(
            "image/jpeg",
            0.95
        );

        photo.src = photoData;

        video.style.display = "none";

        photo.style.display = "block";

        captureBtn.style.display = "none";

        retakeBtn.style.display = "inline-block";

        downloadBtn.style.display = "inline-block";

        shareBtn.style.display = "inline-block";

        message.textContent =
            "Photo captured! 🎉";

    }


    // Take photo button
    captureBtn.addEventListener(
        "click",
        startCountdown
    );


    // Retake
    retakeBtn.addEventListener(
        "click",
        () => {

            photo.style.display = "none";

            video.style.display = "block";

            captureBtn.style.display = "inline-block";

            retakeBtn.style.display = "none";

            downloadBtn.style.display = "none";

            shareBtn.style.display = "none";

            message.textContent =
                "Ready for another photo!";

        }
    );


    // Download
    downloadBtn.addEventListener(
        "click",
        () => {

            downloadBtn.href = photoData;

        }
    );


    // Share
    shareBtn.addEventListener(
        "click",
        async () => {

            try {

                const response =
                    await fetch(photoData);

                const blob =
                    await response.blob();

                const file =
                    new File(
                        [blob],
                        "photo-booth.jpg",
                        {
                            type: "image/jpeg"
                        }
                    );

                if (
                    navigator.share &&
                    navigator.canShare &&
                    navigator.canShare({ files: [file] })
                ) {

                    await navigator.share({
                        title: "My Photo Booth Photo",
                        text: "Check out my photo!",
                        files: [file]
                    });

                }

                else {

                    alert(
                        "Sharing is not supported on this browser. Please download the photo."
                    );

                }

            }

            catch (error) {

                console.error(error);

            }

        }
    );


    // Switch camera
    cameraBtn.addEventListener(
        "click",
        () => {

            if (facingMode === "user") {

                facingMode = "environment";

            }

            else {

                facingMode = "user";

            }

            startCamera();

        }
    );


    // Start
    startCamera();

</script>

</body>
</html>
